name: kwadra_management
description: A thoughtful workspace for Philippine rental property management.
publish_to: none
version: 0.6.0+7
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.6
  http: 1.6.0
  file_picker: 13.1.0
  web: 1.1.1
  cupertino_icons: 1.0.8
  flutter_secure_storage: 11.2.0
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
