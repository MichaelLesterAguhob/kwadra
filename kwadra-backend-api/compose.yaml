services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: kwadra
      POSTGRES_USER: kwadra_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for Docker PostgreSQL}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kwadra_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwadra_app -d kwadra"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kwadra_postgres:
